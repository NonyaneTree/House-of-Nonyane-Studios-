<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payroll Calendar</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 1400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
}

h1, h2, h3 {
    margin-top: 0;
    color: #222;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select,
button {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

button {
    border: none;
    background: #007bff;
    color: white;
    cursor: pointer;
    font-weight: bold;
    margin-top: 5px;
}

button:hover {
    background: #0056b3;
}

.button-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin: 20px 0;
}

.generate-btn {
    background: #198754;
}

.calculate-btn {
    background: #0d6efd;
}

.save-btn {
    background: #6f42c1;
}

.download-btn {
    background: #fd7e14;
}

.restart-btn {
    background: #dc3545;
}

.calendar-wrapper {
    overflow-x: auto;
    margin-top: 20px;
}

table {
    border-collapse: collapse;
    min-width: 1200px;
    width: 100%;
}

th,
td {
    border: 1px solid #ccc;
    padding: 7px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #f1f1f1;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 2;
}

.employee-cell {
    min-width: 160px;
}

.rate-cell,
.hours-cell {
    min-width: 120px;
}

.day-cell {
    min-width: 145px;
}

.day-date {
    font-weight: bold;
    margin-bottom: 6px;
}

.day-cell input,
.day-cell select {
    width: 100%;
    margin-bottom: 4px;
    padding: 6px;
    font-size: 12px;
}

.total-cell {
    min-width: 110px;
    font-weight: bold;
}

.results {
    margin-top: 20px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 7px;
    font-size: 18px;
}

.status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 5px;
    background: #e9f7ef;
    color: #146c43;
    display: none;
}

.small-note {
    color: #666;
    font-size: 13px;
    margin-top: 5px;
}

@media (max-width: 700px) {
    body {
        padding: 8px;
    }

    .container {
        padding: 12px;
    }

    h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Payroll Calendar</h1>
    <p class="small-note">
        Complete payroll calendar with attendance, late coming, overtime and payroll calculations.
    </p>

    <div class="form-grid">

        <div class="form-group">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate">
        </div>

        <div class="form-group">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate">
        </div>

        <div class="form-group">
            <label for="employeeCount">Number of Employees</label>
            <input type="number" id="employeeCount" min="1" placeholder="Employees">
        </div>

        <div class="form-group">
            <label for="overtimeHoursPerUnit">Hours Per Overtime Unit</label>
            <input type="number" id="overtimeHoursPerUnit" min="0.01" step="0.01" value="1">
        </div>

        <div class="form-group">
            <label for="hrManagerName">HR Manager Name</label>
            <input type="text" id="hrManagerName" placeholder="HR Manager">
        </div>

    </div>

    <button class="generate-btn" onclick="generateCalendar()">
        Generate Payroll Calendar
    </button>

    <div id="calendarContainer"></div>

    <div class="button-row">

        <button
            id="calculateBtn"
            class="calculate-btn"
            style="display:none;"
            onclick="calculatePayroll()">
            Calculate Payroll
        </button>

        <button
            id="saveBtn"
            class="save-btn"
            style="display:none;"
            onclick="savePayroll()">
            Save Payroll
        </button>

        <button
            id="downloadBtn"
            class="download-btn"
            style="display:none;"
            onclick="downloadPayrollPDF()">
            Download Payroll PDF
        </button>

        <button
            id="restartBtn"
            class="restart-btn"
            style="display:none;"
            onclick="restartPayroll()">
            Restart Payroll
        </button>

    </div>

    <div id="results" class="results" style="display:none;"></div>

    <div id="status" class="status"></div>

</div>

<script>

const STORAGE_KEY = "payrollCalendarData";

/* ================================
   DATE HELPERS
================================ */

function formatDate(date) {
    return date.toISOString().split("T")[0];
}

function getDatesBetween(start, end) {

    const dates = [];

    let current = new Date(start + "T00:00:00");
    const last = new Date(end + "T00:00:00");

    while (current <= last) {

        dates.push(formatDate(current));

        current.setDate(current.getDate() + 1);
    }

    return dates;
}


/* ================================
   GENERATE CALENDAR
================================ */

function generateCalendar() {

    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;
    const employeeCount =
        parseInt(document.getElementById("employeeCount").value);

    if (!startDate || !endDate) {
        alert("Please enter a start date and end date.");
        return;
    }

    if (new Date(startDate) > new Date(endDate)) {
        alert("Start date cannot be after end date.");
        return;
    }

    if (!employeeCount || employeeCount <= 0) {
        alert("Please enter a valid number of employees.");
        return;
    }

    const dates = getDatesBetween(startDate, endDate);

    let html = `
        <div class="calendar-wrapper">
        <table>

        <thead>
            <tr>
                <th class="employee-cell">Employee Name</th>
                <th class="rate-cell">Rate / Hour</th>
                <th class="hours-cell">Hours / Day</th>
    `;

    dates.forEach(date => {

        html += `
            <th class="day-cell">
                <div class="day-date">${date}</div>
                Attendance<br>
                Late Hours<br>
                Overtime Hours<br>
                Overtime %
            </th>
        `;
    });

    html += `
                <th class="total-cell">Total Present</th>
                <th class="total-cell">Total Hours</th>
                <th class="total-cell">Total Pay</th>
            </tr>
        </thead>

        <tbody>
    `;

    for (let i = 1; i <= employeeCount; i++) {

        html += `
            <tr>

                <td class="employee-cell">
                    <input
                        type="text"
                        id="employeeName${i}"
                        placeholder="Employee ${i}">
                </td>

                <td class="rate-cell">
                    <input
                        type="number"
                        id="rate${i}"
                        min="0"
                        step="0.01"
                        placeholder="Rate">
                </td>

                <td class="hours-cell">
                    <input
                        type="number"
                        id="hours${i}"
                        min="0"
                        step="0.01"
                        placeholder="Hours">
                </td>
        `;

        dates.forEach(date => {

            html += `
                <td class="day-cell">

                    <select
                        data-employee="${i}"
                        data-date="${date}"
                        class="attendance">

                        <option value="P">P</option>
                        <option value="A">A</option>

                    </select>

                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="Late"
                        data-employee="${i}"
                        data-date="${date}"
                        class="lateHours">

                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="OT"
                        data-employee="${i}"
                        data-date="${date}"
                        class="overtimeHours">

                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="OT %"
                        data-employee="${i}"
                        data-date="${date}"
                        class="overtimePercent">

                </td>
            `;
        });

        html += `
                <td id="totalPresent${i}" class="total-cell">0</td>
                <td id="totalHoursWorked${i}" class="total-cell">0.00</td>
                <td id="totalPay${i}" class="total-cell">0.00</td>

            </tr>
        `;
    }

    html += `
        </tbody>
        </table>
        </div>
    `;

    document.getElementById("calendarContainer").innerHTML = html;

    document.getElementById("calculateBtn").style.display = "block";
    document.getElementById("saveBtn").style.display = "block";
    document.getElementById("restartBtn").style.display = "block";

    document.getElementById("downloadBtn").style.display = "none";

    document.getElementById("results").style.display = "none";

    showStatus("Payroll calendar generated.");
}


/* ================================
   CALCULATE PAYROLL
================================ */

function calculatePayroll() {

    const employeeCount =
        parseInt(document.getElementById("employeeCount").value);

    const overtimeHoursPerUnit =
        parseFloat(
            document.getElementById("overtimeHoursPerUnit").value
        ) || 1;

    let grandTotal = 0;

    for (let i = 1; i <= employeeCount; i++) {

        const rate =
            parseFloat(document.getElementById(`rate${i}`).value) || 0;

        const hours =
            parseFloat(document.getElementById(`hours${i}`).value) || 0;

        if (rate <= 0 || hours <= 0) {

            alert(
                `Please enter a valid rate and daily hours for Employee ${i}.`
            );

            return;
        }

        const attendance =
            document.querySelectorAll(
                `.attendance[data-employee="${i}"]`
            );

        const lateInputs =
            document.querySelectorAll(
                `.lateHours[data-employee="${i}"]`
            );

        const overtimeInputs =
            document.querySelectorAll(
                `.overtimeHours[data-employee="${i}"]`
            );

        const overtimePercentInputs =
            document.querySelectorAll(
                `.overtimePercent[data-employee="${i}"]`
            );

        let totalPresent = 0;
        let totalHoursWorked = 0;
        let totalOvertimePay = 0;

        attendance.forEach((select, index) => {

            const lateHours =
                parseFloat(lateInputs[index].value) || 0;

            const overtimeHours =
                parseFloat(overtimeInputs[index].value) || 0;

            const overtimePercent =
                parseFloat(overtimePercentInputs[index].value) || 0;

            if (select.value === "P") {

                totalPresent++;

                const workedHours =
                    Math.max(0, hours - lateHours);

                totalHoursWorked += workedHours;

                const overtimeRate =
                    rate *
                    (1 + overtimePercent / 100);

                const overtimePay =
                    (overtimeHours / overtimeHoursPerUnit)
                    * overtimeRate;

                totalOvertimePay += overtimePay;
            }
        });

        const basicPay =
            rate * totalHoursWorked;

        const totalPay =
            basicPay + totalOvertimePay;

        document.getElementById(`totalPresent${i}`)
            .textContent = totalPresent;

        document.getElementById(`totalHoursWorked${i}`)
            .textContent = totalHoursWorked.toFixed(2);

        document.getElementById(`totalPay${i}`)
            .textContent = totalPay.toFixed(2);

        grandTotal += totalPay;
    }

    const results = document.getElementById("results");

    results.style.display = "block";

    results.innerHTML = `
        Grand Total Payroll:
        <strong>${grandTotal.toFixed(2)}</strong>
    `;

    document.getElementById("downloadBtn").style.display = "block";

    showStatus("Payroll calculated successfully.");
}


/* ================================
   COLLECT PAYROLL DATA
================================ */

function collectPayrollData() {

    const employeeCount =
        parseInt(document.getElementById("employeeCount").value);

    const data = [];

    for (let i = 1; i <= employeeCount; i++) {

        const dailyRecords = [];

        const attendance =
            document.querySelectorAll(
                `.attendance[data-employee="${i}"]`
            );

        const lateInputs =
            document.querySelectorAll(
                `.lateHours[data-employee="${i}"]`
            );

        const overtimeInputs =
            document.querySelectorAll(
                `.overtimeHours[data-employee="${i}"]`
            );

        const overtimePercentInputs =
            document.querySelectorAll(
                `.overtimePercent[data-employee="${i}"]`
            );

        attendance.forEach((select, index) => {

            dailyRecords.push({

                date: select.dataset.date,

                attendance: select.value,

                lateHours:
                    parseFloat(lateInputs[index].value) || 0,

                overtimeHours:
                    parseFloat(overtimeInputs[index].value) || 0,

                overtimePercent:
                    parseFloat(
                        overtimePercentInputs[index].value
                    ) || 0
            });
        });

        data.push({

            name:
                document.getElementById(
                    `employeeName${i}`
                ).value || `Employee ${i}`,

            rate:
                parseFloat(
                    document.getElementById(`rate${i}`).value
                ) || 0,

            hoursPerDay:
                parseFloat(
                    document.getElementById(`hours${i}`).value
                ) || 0,

            totalPresent:
                parseInt(
                    document.getElementById(
                        `totalPresent${i}`
                    ).textContent
                ) || 0,

            totalHoursWorked:
                parseFloat(
                    document.getElementById(
                        `totalHoursWorked${i}`
                    ).textContent
                ) || 0,

            totalPay:
                parseFloat(
                    document.getElementById(
                        `totalPay${i}`
                    ).textContent
                ) || 0,

            dailyRecords
        });
    }

    return data;
}


/* ================================
   SAVE LOCAL STORAGE
================================ */

function savePayroll() {

    if (!document.querySelector(".attendance")) {

        alert("Please generate the payroll calendar first.");
        return;
    }

    calculatePayroll();

    const payrollData = collectPayrollData();

    const completeData = {

        startDate:
            document.getElementById("startDate").value,

        endDate:
            document.getElementById("endDate").value,

        employeeCount:
            parseInt(
                document.getElementById("employeeCount").value
            ),

        overtimeHoursPerUnit:
            parseFloat(
                document.getElementById(
                    "overtimeHoursPerUnit"
                ).value
            ) || 1,

        hrManagerName:
            document.getElementById(
                "hrManagerName"
            ).value || "",

        employees: payrollData,

        savedAt: new Date().toISOString()
    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(completeData)
    );

    document.getElementById("downloadBtn").style.display = "block";
    document.getElementById("restartBtn").style.display = "block";

    showStatus("Payroll saved to local storage.");
}


/* ================================
   LOAD PAYROLL
================================ */

window.addEventListener("load", loadPayroll);

function loadPayroll() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) return;

    try {

        const data = JSON.parse(saved);

        document.getElementById("startDate").value =
            data.startDate || "";

        document.getElementById("endDate").value =
            data.endDate || "";

        document.getElementById("employeeCount").value =
            data.employeeCount || data.employees.length;

        document.getElementById("overtimeHoursPerUnit").value =
            data.overtimeHoursPerUnit || 1;

        document.getElementById("hrManagerName").value =
            data.hrManagerName || "";

        generateCalendar();

        data.employees.forEach((employee, index) => {

            const i = index + 1;

            document.getElementById(
                `employeeName${i}`
            ).value = employee.name;

            document.getElementById(
                `rate${i}`
            ).value = employee.rate;

            document.getElementById(
                `hours${i}`
            ).value = employee.hoursPerDay;

            employee.dailyRecords.forEach((record, j) => {

                const attendance =
                    document.querySelectorAll(
                        `.attendance[data-employee="${i}"]`
                    )[j];

                const late =
                    document.querySelectorAll(
                        `.lateHours[data-employee="${i}"]`
                    )[j];

                const overtime =
                    document.querySelectorAll(
                        `.overtimeHours[data-employee="${i}"]`
                    )[j];

                const overtimePercent =
                    document.querySelectorAll(
                        `.overtimePercent[data-employee="${i}"]`
                    )[j];

                if (attendance) {
                    attendance.value =
                        record.attendance;
                }

                if (late) {
                    late.value =
                        record.lateHours;
                }

                if (overtime) {
                    overtime.value =
                        record.overtimeHours;
                }

                if (overtimePercent) {
                    overtimePercent.value =
                        record.overtimePercent;
                }
            });
        });

        calculatePayroll();

        document.getElementById("saveBtn").style.display = "block";
        document.getElementById("downloadBtn").style.display = "block";
        document.getElementById("restartBtn").style.display = "block";

        showStatus("Saved payroll restored from local storage.");

    } catch (error) {

        console.error(error);

        alert("Saved payroll data could not be loaded.");
    }
}


/* ================================
   DOWNLOAD FULL PAYROLL PDF
================================ */

function downloadPayrollPDF() {

    // Make sure the latest calculations are saved first
    calculatePayroll();

    const payrollData = collectPayrollData();

    if (!payrollData || payrollData.length === 0) {
        alert("No payroll data available.");
        return;
    }

    const startDate =
        document.getElementById("startDate").value;

    const endDate =
        document.getElementById("endDate").value;

    const overtimeHoursPerUnit =
        parseFloat(
            document.getElementById("overtimeHoursPerUnit").value
        ) || 1;

    // Get HR Manager directly from the field
    const hrName =
        document.getElementById("hrManagerName").value.trim()
        || "HR Manager";

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF({
        orientation: "landscape",
        unit: "mm",
        format: "a4"
    });

    const pageWidth =
        doc.internal.pageSize.getWidth();

    const pageHeight =
        doc.internal.pageSize.getHeight();


    /* ==========================================
       SUMMARY PAGE
    ========================================== */

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);

    doc.text(
        "PAYROLL CALENDAR",
        pageWidth / 2,
        15,
        { align: "center" }
    );

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);

    doc.text(
        `Payroll Period: ${startDate} to ${endDate}`,
        10,
        25
    );

    doc.text(
        `HR Manager: ${hrName}`,
        10,
        31
    );

    doc.text(
        `Overtime Unit: ${overtimeHoursPerUnit} hour(s)`,
        10,
        37
    );

    let y = 47;

    const columns = [
        "Employee",
        "Rate/Hr",
        "Hours/Day",
        "Present",
        "Hours Worked",
        "Total Pay"
    ];

    const widths = [
        65,
        30,
        30,
        30,
        45,
        40
    ];

    let x = 10;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);

    columns.forEach((column, i) => {

        doc.rect(
            x,
            y,
            widths[i],
            9
        );

        doc.text(
            column,
            x + 2,
            y + 6
        );

        x += widths[i];
    });

    y += 9;

    doc.setFont("helvetica", "normal");

    let grandTotal = 0;

    payrollData.forEach(employee => {

        x = 10;

        const values = [
            employee.name,
            Number(employee.rate).toFixed(2),
            Number(employee.hoursPerDay).toFixed(2),
            String(employee.totalPresent),
            Number(employee.totalHoursWorked).toFixed(2),
            Number(employee.totalPay).toFixed(2)
        ];

        values.forEach((value, i) => {

            doc.rect(
                x,
                y,
                widths[i],
                8
            );

            doc.text(
                String(value),
                x + 2,
                y + 5
            );

            x += widths[i];
        });

        y += 8;

        grandTotal += Number(employee.totalPay) || 0;

        // Start a new page if the table becomes too long
        if (y > 165) {

            doc.addPage();

            y = 20;

            doc.setFont("helvetica", "bold");
            doc.text(
                "PAYROLL CALENDAR - CONTINUED",
                pageWidth / 2,
                12,
                { align: "center" }
            );

            doc.setFont("helvetica", "normal");
        }
    });


    /* ==========================================
       GRAND TOTAL
    ========================================== */

    y += 8;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);

    doc.text(
        `GRAND TOTAL PAYROLL: ${grandTotal.toFixed(2)}`,
        10,
        y
    );


    /* ==========================================
       HR SIGNATURE SECTION
    ========================================== */

    const signatureY = pageHeight - 35;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);

    // Signature line
    doc.line(
        pageWidth - 105,
        signatureY,
        pageWidth - 35,
        signatureY
    );

    doc.text(
        "HR Manager Signature",
        pageWidth - 105,
        signatureY + 6
    );

    // HR name
    doc.text(
        `Name: ${hrName}`,
        pageWidth - 105,
        signatureY + 13
    );

    // Date line
    doc.line(
        pageWidth - 105,
        signatureY + 22,
        pageWidth - 35,
        signatureY + 22
    );

    doc.text(
        "Date",
        pageWidth - 105,
        signatureY + 28
    );


    /* ==========================================
       INDIVIDUAL EMPLOYEE PAYROLL PAGES
    ========================================== */

    payrollData.forEach(employee => {

        doc.addPage();

        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);

        doc.text(
            "EMPLOYEE PAYROLL RECORD",
            pageWidth / 2,
            15,
            { align: "center" }
        );

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        doc.text(
            `Employee: ${employee.name}`,
            10,
            27
        );

        doc.text(
            `Rate / Hour: ${Number(employee.rate).toFixed(2)}`,
            10,
            34
        );

        doc.text(
            `Hours / Day: ${Number(employee.hoursPerDay).toFixed(2)}`,
            10,
            41
        );

        doc.text(
            `Payroll Period: ${startDate} to ${endDate}`,
            10,
            48
        );

        let top = 58;

        const detailColumns = [
            "Date",
            "Attendance",
            "Late Hours",
            "Overtime Hours",
            "Overtime %"
        ];

        const detailWidths = [
            55,
            45,
            40,
            45,
            40
        ];

        x = 10;

        doc.setFont("helvetica", "bold");

        detailColumns.forEach((column, i) => {

            doc.rect(
                x,
                top,
                detailWidths[i],
                8
            );

            doc.text(
                column,
                x + 2,
                top + 5
            );

            x += detailWidths[i];
        });

        top += 8;

        doc.setFont("helvetica", "normal");

        employee.dailyRecords.forEach(record => {

            if (top > 165) {

                doc.addPage();

                top = 18;

                doc.setFont("helvetica", "bold");

                doc.text(
                    `${employee.name} - PAYROLL CONTINUED`,
                    pageWidth / 2,
                    10,
                    { align: "center" }
                );

                x = 10;

                detailColumns.forEach((column, i) => {

                    doc.rect(
                        x,
                        top,
                        detailWidths[i],
                        8
                    );

                    doc.text(
                        column,
                        x + 2,
                        top + 5
                    );

                    x += detailWidths[i];
                });

                top += 8;

                doc.setFont("helvetica", "normal");
            }

            x = 10;

            const values = [
                record.date,
                record.attendance,
                Number(record.lateHours).toFixed(2),
                Number(record.overtimeHours).toFixed(2),
                `${Number(record.overtimePercent).toFixed(2)}%`
            ];

            values.forEach((value, i) => {

                doc.rect(
                    x,
                    top,
                    detailWidths[i],
                    8
                );

                doc.text(
                    String(value),
                    x + 2,
                    top + 5
                );

                x += detailWidths[i];
            });

            top += 8;
        });


        /* ======================================
           EMPLOYEE TOTALS
        ====================================== */

        top += 10;

        doc.setFont("helvetica", "bold");

        doc.text(
            `Total Present: ${employee.totalPresent}`,
            10,
            top
        );

        doc.text(
            `Total Hours Worked: ${Number(
                employee.totalHoursWorked
            ).toFixed(2)}`,
            10,
            top + 7
        );

        doc.text(
            `Total Pay: ${Number(
                employee.totalPay
            ).toFixed(2)}`,
            10,
            top + 14
        );


        /* ======================================
           HR SIGNATURE
        ====================================== */

        const employeeSignatureY =
            pageHeight - 35;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        doc.line(
            pageWidth - 105,
            employeeSignatureY,
            pageWidth - 35,
            employeeSignatureY
        );

        doc.text(
            "HR Manager Signature",
            pageWidth - 105,
            employeeSignatureY + 6
        );

        doc.text(
            `Name: ${hrName}`,
            pageWidth - 105,
            employeeSignatureY + 13
        );

        doc.line(
            pageWidth - 105,
            employeeSignatureY + 22,
            pageWidth - 35,
            employeeSignatureY + 22
        );

        doc.text(
            "Date",
            pageWidth - 105,
            employeeSignatureY + 28
        );
    });


    /* ==========================================
       DOWNLOAD
    ========================================== */

    const filename =
        `Payroll_${startDate}_to_${endDate}.pdf`;

    doc.save(filename);

    showStatus(
        "Payroll PDF downloaded with HR signature lines."
    );
}


/* ================================
   RESTART
================================ */

function restartPayroll() {

    if (!confirm(
        "Are you sure you want to restart? This will delete the saved payroll."
    )) {
        return;
    }

    localStorage.removeItem(STORAGE_KEY);

    document.getElementById("calendarContainer").innerHTML = "";

    document.getElementById("results").innerHTML = "";

    document.getElementById("results").style.display = "none";

    document.getElementById("calculateBtn").style.display = "none";

    document.getElementById("saveBtn").style.display = "none";

    document.getElementById("downloadBtn").style.display = "none";

    document.getElementById("restartBtn").style.display = "none";

    document.getElementById("startDate").value = "";

    document.getElementById("endDate").value = "";

    document.getElementById("employeeCount").value = "";

    document.getElementById("overtimeHoursPerUnit").value = "1";

    document.getElementById("hrManagerName").value = "";

    showStatus("Payroll restarted.");
}


/* ================================
   STATUS MESSAGE
================================ */

function showStatus(message) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.style.display = "block";

    setTimeout(() => {

        status.style.display = "none";

    }, 3000);
}

</script>
